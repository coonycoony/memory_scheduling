<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대학교 공지사항 검색</title>
  <link rel="stylesheet" href="frontend.css" />
</head>
<body>
  <div class="profile-container">
    <button class="profile-btn" onclick="toggleProfile()">
      <span class="avatar">🎓</span>
      <span id="profileNameBtn">프로필</span>
    </button>
    
    <div class="profile-dropdown" id="profileDropdown">
      <div class="profile-info">
        <div class="profile-avatar">🎓</div>
        <div class="profile-name" id="profileName">로그인 필요</div>
        <div class="profile-detail" id="profileSchool"></div>
        <div class="profile-detail" id="profileMajor"></div>
        <div class="profile-detail" id="profileYear"></div>
      </div>
      <div class="profile-interests" id="profileInterests"></div>
      <button class="logout-btn" onclick="handleLogout()">로그아웃 (정보 초기화)</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h1>대학교 공지사항 검색</h1>
      <p>학교와 게시판을 선택하여 공지를 불러오고 카테고리별로 확인할 수 있습니다.</p>
      
      <div style="display: flex; gap: 12px; justify-content: center; margin-top: 16px; flex-wrap: wrap;">
        <button onclick="location.href='schedule_page.html'" style="padding: 12px 24px; background: #10b981; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); transition: 0.2s;">
          📅 내 스케줄러 관리하기
        </button>
        <button onclick="location.href='my_notice_archive.html'" style="padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); transition: 0.2s;">
          🗂️ 내 공지 보관함
        </button>
        <button onclick="openManageModal()" style="padding: 12px 24px; background: #8b5cf6; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2); transition: 0.2s;">
          ⚙️ 게시판 관리 (추가/삭제)
        </button>
      </div>
    </div>

    <div class="search-box">
      <select id="universitySelect" onchange="handleUniversityChange()">
        <option value="">학교 목록을 불러오는 중...</option>
      </select>
      
      <select id="boardSelect" disabled>
        <option value="">게시판 선택 (전체)</option>
      </select>

      <select id="searchDays">
        <option value="15" selected>최근 15일 (기본)</option>
        <option value="30">최근 30일</option>
        <option value="7">최근 7일</option>
        <option value="3">최근 3일</option>
      </select>
      
      <button onclick="searchNotices()">검색</button>
    </div>

    <div class="filter-container" id="filterContainer">
      <button class="filter-btn active" onclick="applyFilter('전체')">전체</button>
      <button class="filter-btn" onclick="applyFilter('일반')">일반</button>
      <button class="filter-btn" onclick="applyFilter('장학')">장학</button>
      <button class="filter-btn" onclick="applyFilter('학사')">학사</button>
      <button class="filter-btn" onclick="applyFilter('입학/등록')">입학/등록</button>
      <button class="filter-btn" onclick="applyFilter('취업/채용')">취업/채용</button>
      <button class="filter-btn" onclick="applyFilter('공모전/대회')">공모전/대회</button>
      <button class="filter-btn" onclick="applyFilter('모집/봉사')">모집/봉사</button>
      <button class="filter-btn" onclick="applyFilter('시설/행정')">시설/행정</button>
      <button class="filter-btn" onclick="applyFilter('안전')">안전</button>
      <button class="filter-btn" onclick="applyFilter('기타')">기타</button>
    </div>

    <div class="recommend-section" id="recommendSection">
      <div class="recommend-header">
        ✨ <span id="recommendTitle">나를 위한 맞춤 추천 공지</span>
      </div>
      <div class="recommend-list" id="recommendList"></div>
    </div>

    <div class="list-header">
      <div class="status" id="status">학교를 선택하고 검색하세요.</div>
      <select id="sortSelect" class="sort-select" onchange="handleSortChange()">
        <option value="desc">최신순</option>
        <option value="asc">과거순</option>
      </select>
    </div>
    
    <div class="notice-list" id="noticeList"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="modal-overlay" id="manageModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeManageModal()">✖</button>
      <h2 style="font-size: 20px; margin-bottom: 20px; color: #111827;">⚙️ 크롤링 소스 관리</h2>
      
      <div class="manage-section">
        <h3 style="font-size: 16px; margin-bottom: 12px; color: #374151;">➕ 새 게시판 등록</h3>
        <p style="font-size: 13px; color: #6b7280; margin-bottom: 16px;">2페이지와 3페이지 URL을 모두 입력하면 시스템이 페이징 패턴을 자동 분석합니다.</p>
        
        <form id="registerForm" onsubmit="handleRegisterSource(event)" style="display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="regUniv" placeholder="대학명 (예: OO대학교)" required style="flex: 1; min-width: 150px; padding: 10px; border: 1px solid #d0d7e2; border-radius: 8px; outline: none;" />
            <input type="text" id="regBoard" placeholder="게시판명 (예: 공지사항)" required style="flex: 1; min-width: 150px; padding: 10px; border: 1px solid #d0d7e2; border-radius: 8px; outline: none;" />
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; flex-direction: column;">
            <input type="url" id="regUrl1" placeholder="2페이지 URL (예: https://...?page=2)" required style="flex: 1; padding: 10px; border: 1px solid #d0d7e2; border-radius: 8px; outline: none;" />
            <input type="url" id="regUrl2" placeholder="3페이지 URL (예: https://...?page=3)" required style="flex: 1; padding: 10px; border: 1px solid #d0d7e2; border-radius: 8px; outline: none;" />
          </div>
          <button type="submit" style="padding: 12px; background: #8b5cf6; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 4px;">등록하기</button>
        </form>
      </div>

      <div class="manage-section" style="margin-bottom: 0;">
        <h3 style="font-size: 16px; margin-bottom: 12px; color: #374151;">🗑️ 등록된 게시판 삭제</h3>
        <select id="manageUnivSelect" onchange="loadManageBoards()" style="width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #d0d7e2; outline: none; font-size: 14px;">
          <option value="">학교를 선택하세요</option>
        </select>
        
        <div id="manageBoardList" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column;">
          <div style="font-size: 13px; color: #9ca3af; text-align: center; padding: 16px;">학교를 선택하면 등록된 게시판이 표시됩니다.</div>
        </div>
      </div>

    </div>
  </div>

  <script src="frontend.js"></script>
</body>
</html>

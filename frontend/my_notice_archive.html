<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 공지 보관함</title>
  <link rel="stylesheet" href="my_notice_archive.css" />
  <script defer src="my_notice_archive.js"></script>
</head>

<body>
  <button type="button" class="user-chip" id="userChipBtn">
    <span class="user-chip-emoji">🎓</span>
    <span class="user-chip-name" id="userChipName">사용자 님</span>
  </button>

  <div class="profile-modal" id="profileModal">
    <div class="profile-card">
      <div class="profile-logo">🎓</div>

      <div class="profile-name" id="profileName">사용자명</div>

      <div class="profile-text" id="profileSchool">학교명</div>
      <div class="profile-text" id="profileMajor">학과명</div>
      <div class="profile-text" id="profileYear">학년</div>

      <div class="profile-separator"></div>

      <div class="profile-tags" id="profileTags"></div>

      <button type="button" class="profile-logout" id="logoutBtn">
        로그아웃 (정보 초기화)
      </button>
    </div>
  </div>

  <div class="archive-container">
    <div class="left-panel">
      <div class="card header">
        <h1>내 공지 보관함</h1>
        <button type="button" onclick="location.href='frontend.html'" class="btn-primary back-to-search-btn">
          🔍 공지 검색으로 돌아가기
        </button>
        <button onclick="location.href='schedule_page.html'" class="btn-primary back-to-search-btn">
          📅 내 스케줄러 관리하기
        </button>
      </div>

      <div class="card">
        <div class="section-title">보관함 필터</div>
        <div class="selected-date" id="resultText">저장한 공지를 검색하고 분류별로 다시 볼 수 있어요</div>
        <div class="badge">보관된 공지 다시 보기</div>

        <div class="form-group">
          <label class="form-label" for="keywordInput">검색어</label>
          <input type="text" id="keywordInput" class="form-control" placeholder="제목, 메모, 부서" />
        </div>

        <div class="form-group">
          <label class="form-label" for="categoryFilter">종류</label>
          <select id="categoryFilter" class="form-control">
            <option value="전체">전체</option>
            <option value="장학">장학</option>
            <option value="학사">학사</option>
            <option value="입학/등록">입학/등록</option>
            <option value="취업/채용">취업/채용</option>
            <option value="모집/봉사">모집/봉사</option>
            <option value="기타">기타</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="sortFilter">정렬</label>
          <select id="sortFilter" class="form-control">
            <option value="saved-desc">최근 저장순</option>
            <option value="saved-asc">오래된 저장순</option>
            <option value="date-asc">날짜 빠른순</option>
            <option value="date-desc">날짜 늦은순</option>
          </select>
        </div>

        <div class="button-row">
          <button type="button" class="btn-secondary" id="resetBtn">필터 초기화</button>
          <button type="button" class="btn-danger" id="clearBtn">전체 비우기</button>
        </div>

        <div class="event-list" id="savedList"></div>
      </div>

      <div class="card">
        <div class="section-title">보관함 요약</div>
        <div class="summary-list">
          <div class="summary-item">전체 공지<strong id="summaryTotal">0</strong></div>
          <div class="summary-item">장학 공지<strong id="summaryScholarship">0</strong></div>
          <div class="summary-item">학사 공지<strong id="summaryAcademic">0</strong></div>
          <div class="summary-item">입학/등록 공지<strong id="summaryAdmission">0</strong></div>
          <div class="summary-item">취업/채용 공지<strong id="summaryJob">0</strong></div>
          <div class="summary-item">공모전/대회 공지<strong id="summaryContest">0</strong></div>
          <div class="summary-item">모집/봉사 공지<strong id="summaryVolunteer">0</strong></div>
          <div class="summary-item">시설/행정 공지<strong id="summaryFacility">0</strong></div>
          <div class="summary-item">안전 공지<strong id="summarySafety">0</strong></div>
          <div class="summary-item">기타 공지<strong id="summaryEtc">0</strong></div>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="card archive-board">
        <div class="archive-header">
          <div class="archive-title">보관한 공지 카드</div>
          <div class="status-text" id="status">보관함을 불러오는 중입니다.</div>
        </div>
        <div class="archive-grid" id="noticeGrid"></div>
      </div>
    </div>
  </div>
</body>
</html>

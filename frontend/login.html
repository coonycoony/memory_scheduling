<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대학 공지 스케줄러 - 로그인</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="logo">🎓</div>
      <h1>반가워요!</h1>
      <p>서비스 이용을 위해 학생 정보를 입력해주세요.</p>
    </div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="userName">이름</label>
        <input type="text" id="userName" placeholder="성함을 입력해주세요" required />
      </div>
      <div class="form-group">
        <label for="userSchool">학교명</label>
        <input type="text" id="userSchool" placeholder="예: 서울대학교" required />
      </div>
      <div class="form-group">
        <label for="userMajor">학과(전공)</label>
        <input type="text" id="userMajor" placeholder="예: 컴퓨터공학과" required />
      </div>
      <div class="form-group">
        <label for="userYear">학년</label>
        <select id="userYear" style="width: 100%; padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 15px;" required>
          <option value="">학년을 선택해주세요</option>
          <option value="1">1학년 (신입생)</option>
          <option value="2">2학년</option>
          <option value="3">3학년</option>
          <option value="4">4학년 이상 (취업/졸업 준비)</option>
        </select>
      </div>
      <div class="form-group">
        <label>가장 관심 있는 분야 (다중 선택 가능)</label>
        <div class="checkbox-group" id="interestGroup">
          <label><input type="checkbox" value="장학"> 💰 장학금</label>
          <label><input type="checkbox" value="취업/채용"> 💼 취업/인턴</label>
          <label><input type="checkbox" value="공모전/대회"> 🏆 공모전/대회</label>
          <label><input type="checkbox" value="학사"> 📚 학사/졸업</label>
          <label><input type="checkbox" value="모집/봉사"> 🙋 대외활동/봉사</label>
          <label><input type="checkbox" value="시설/행정"> 🏢 시설/기숙사</label>
        </div>
      </div>
      <button type="submit" class="btn-login">시작하기</button>
    </form>
    <div class="login-footer">
      입력하신 정보는 브라우저 내에 안전하게 저장되며,<br>
      대학교 맞춤형 공지사항 추천에만 활용됩니다.
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>

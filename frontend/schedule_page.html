<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지/장학 스케줄러</title>
    <link rel="stylesheet" href="schedule_page.css">
</head>

<body>
    <button type="button" class="user-chip" id="userChipBtn">
      <span class="user-chip-emoji">🎓</span>
      <span class="user-chip-name" id="userChipName">사용자 님</span>
    </button>

    <div class="profile-modal" id="profileModal">
      <div class="profile-card">
        <div class="profile-logo">🎓</div>
        <div class="profile-name" id="profileName">사용자명</div>
        <div class="profile-line-small"></div>
        <div class="profile-text" id="profileSchool">학교명</div>
        <div class="profile-text" id="profileMajor">학과명</div>
        <div class="profile-text" id="profileYear">학년</div>
        <div class="profile-separator"></div>
        <div class="profile-tags" id="profileTags"></div>
        <button type="button" class="profile-logout" id="logoutBtn">
          로그아웃 (정보 초기화)
        </button>
      </div>
    </div>

    <div class="schedule-container">
      <div class="left-panel">
        <div class="card header">
          <div class="header-top">
            <h1>공지 · 장학 스케줄러</h1>
            <button type="button" onclick="location.href='frontend.html'" class="btn-primary back-to-search-btn">
              🔍 공지 검색하러 가기
            </button>
            <button type="button" onclick="location.href='my_notice_archive.html'" class="btn-primary back-to-search-btn">
              🗂️ 공지 보관함으로 가기
            </button>
          </div>
        </div>

        <div class="card scrollable-form">
          <div class="section-title">선택한 날짜</div>
          <div class="selected-date"></div>
          <div class="badge">날짜를 눌러 공지/장학/기타 스케줄을 추가할 수 있어요</div>

          <form id="eventForm">
            <div class="form-group">
              <label class="form-label" for="mainCategory">종류</label>
              <select id="mainCategory" required></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="subCategory">세부항목</label>
              <select id="subCategory" required></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="eventTitle">제목</label>
              <input type="text" id="eventTitle" placeholder="예: 국가장학금 2차 신청" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="startDate">시작 날짜 (선택)</label> <input type="date" id="startDate" />
            </div>
            <div class="form-group">
              <label class="form-label" for="endDate">종료 날짜 (선택)</label> <input type="date" id="endDate" />
            </div>
            <div class="form-group">
              <label class="form-label" for="eventMemo">메모 (선택)</label>
              <textarea id="eventMemo" placeholder="관련 링크, 금액, 해야 할 일을 적어두세요."></textarea>
            </div>
            <div class="button-row">
              <div class="badge">시작 날짜와 종료 날짜를 선택하면 해당 범위 전체에 스케줄을 추가할 수 있어요</div>
              <button type="submit" class="btn-primary">선택한 날짜 범위에 스케줄 추가</button>
              <button type="button" class="btn-secondary" id="deleteAllBtn">선택한 날짜 범위 전체 삭제</button>
            </div>
            <div class="status-text" id="statusText"></div>
          </form>
          <div class="event-list" id="eventList"></div>
        </div>
      </div>

      <div class="right-panel">
        <div class="card calendar-card">
          <div class="calendar-header">
            <button type="button" class="btn-secondary" id="prevMonthBtn">◀</button>
            <div class="calendar-title" id="calendarTitle"></div>
            <button type="button" class="btn-secondary" id="nextMonthBtn">▶</button>
          </div>
          <div class="calendar-weekdays">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
      </div>
    </div>

    <script src="schedule_page.js"></script>
</body>
</html>

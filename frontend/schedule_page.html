<!DOCTYPE html>
<html lang = "ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지/장학 스케줄러</title>
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 60px 20px  20px 20px;
      background: #f5f7fb;
      color: #222;
      overflow-y: auto;
      overflow-x: hidden;
    }
	
    .schedule-container {
      max-width: 100%;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 20px;
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 15px;
      align-items: start;
      position: relative; /* 사용자 칩/팝오버 위치 기준 */
    }

    @media (max-width: 600px) {
      .schedule-container {
        grid-template-columns: 1fr;
      }
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: calc(100vh - 80px);
      overflow-y: hidden;
      overflow-x: hidden;
      width: 340px;
      max-width: 340px;
    }
    
    .left-panel .card:nth-child(2) {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
    }

    .right-panel { 
      min-width: 0;
    }

    .card { 
      background: #fff;
      border: 5px double #e5e7eb;
      border-radius: 16px;
      padding: 14px;
    }

    .header {
      font-size: 15px;
      margin: 0;
      align-items: center;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .selected-date {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .form-group { 
      margin-bottom: 10px; 
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    select,
    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 13px;
      background: #fff;
    }

    input[type="date"] {
      width: 100%;
      display: block;
      height: 35px;
    }

    textarea {
      min-height: 58px;
      resize: vertical;
    }

    select:focus,
    input:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.35);
    }
    
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .back-to-search-btn {
      background: #475569;
      padding: 8px 14px;
    }

    .back-to-search-btn:hover {
      background: #334155;
    }

    .move-btn:hover {
      background: #2563eb;
    }

    .button-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn-primary,
    .btn-secondary {
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      padding: 9px 12px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      font-size: 13px;
      padding: 8px 10px;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .event-list {
      margin-top: 14px;
      height: 35px;
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .event-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      margin-bottom: 6px;
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }  

    .event-main {
      flex: 1;
      min-width: 0;
      width: 250px; 
      max-width: 250px;
      box-sizing: border-box;
    }

    .event-type-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      margin-bottom: 4px;
    }

    .event-type-pill.scholarship {
      background: #fff7ed;
      color: #c2410c;
    }

    .event-type-pill.etc {
      background: #ecfdf3;
      color: #15803d;
    }

    .event-title {
      font-weight: 700;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-time {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }   

    .event-memo {
      font-size: 12px;
      color: #4b5563;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-text {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      padding: 16px 4px;
    }

    .event-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: #2563eb;
      text-decoration: underline;
      cursor: pointer;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-link:hover {
      color: #1d4ed8;
    }

    .calendar-card {
      padding: 16px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-weekdays {
     margin-bottom: 8px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #6b7280;
      padding: 6px 0;
    }

    .calendar-day {
      min-height: 177.4px;
      max-height: 177.4px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      padding: 8px 6px;
      text-align: left;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
      overflow: hidden;
      box-sizing: border-box;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .calendar-day:hover {
      background: #f8fafc;
      border-color: #93c5fd;
    }

    .calendar-day.muted {
      background: #f9fafb;
      color: #9ca3af;
    }

    .calendar-day.today {
      box-shadow: inset 0 0 0 1px #10b981;
    }

    .calendar-day-number {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .calendar-day-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    
    .calendar-day.in-range {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .calendar-day.range-edge {
      border: 2px solid #2563eb;
      background: #bfdbfe;
    }

    .calendar-day-events {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 148.3px;
      overflow: hidden;
    }
    
    .calendar-event-more {
      font-size: 10px;
      color: #6b7280;
    }

    .status-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 10px;
    }

    .status-text.error {
      color: #dc2626;
    }

    .status-text.success {
      color: #15803d;
    }

    .calendar-event-badge {
      display: block;
      max-width: 100%;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 11px;
      color: #fff;
      background: #4b5563;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }

    .calendar-event-badge.scholarship {
      background: #f5da3f;
    }

    .calendar-event-badge.cat-academic {
      background: #2563eb;
    }

    .calendar-event-badge.cat-admission {
      background: #7c3aed;
    }

    .calendar-event-badge.cat-career {
      background: #f97316;
    }

    .calendar-event-badge.cat-contest {
      background: #e11d48;
    }

    .calendar-event-badge.cat-volunteer {
      background: #0d9488;
    }

    .calendar-event-badge.cat-facility {
      background: #0ea5e9;
    }

    .calendar-event-badge.cat-safety {
      background: #22f58b;
    }

    .calendar-event-badge.cat-etc {
      background: #6b7280;
    }

    /* 오른쪽 상단 사용자 버튼 */
    .user-chip {
      position: absolute;
      top: 12px;
      right: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #ffffff;
      border: 2px solid #111827;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    }

    .user-chip-emoji {
      font-size: 18px;
    }

    .user-chip-name {
      font-weight: 600;
    }

    /* 사용자 팝오버 */
    .profile-modal {
      position: absolute;
      top: 60px;
      right: 0;
      display: none;
      z-index: 50;
    }

    .profile-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 26px;
      width: 260px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
      text-align: center;
    }

    .profile-logo {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 14px;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 8px;
    }

    .profile-line-small {
      width: 80%;
      height: 1px;
      background: transparent;
      margin: 0 auto 4px;
    }

    .profile-text {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.5;
    }

    .profile-separator {
      width: 80%;
      height: 1px;
      background: #e5e7eb;
      margin: 14px auto 10px;
    }

    .profile-tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .profile-tag-pill {
      padding: 4px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 600;
    }

    .profile-logout {
      margin-top: 4px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 999px;
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .profile-logout:hover {
      background: #fecaca;
    }
    </style>
</head>

<body>
    <!-- 오른쪽 상단 사용자 버튼 -->
      <button type="button" class="user-chip" id="userChipBtn">
        <span class="user-chip-emoji">🎓</span>
        <span class="user-chip-name" id="userChipName">사용자 님</span>
      </button>

      <!-- 사용자 팝오버 -->
      <div class="profile-modal" id="profileModal">
        <div class="profile-card">
          <div class="profile-logo">🎓</div>

          <div class="profile-name" id="profileName">사용자명</div>
          <div class="profile-line-small"></div>

          <div class="profile-text" id="profileSchool">학교명</div>
          <div class="profile-text" id="profileMajor">학과명</div>
          <div class="profile-text" id="profileYear">학년</div>

          <div class="profile-separator"></div>

          <div class="profile-tags" id="profileTags"></div>

          <button type="button" class="profile-logout" id="logoutBtn">
            로그아웃 (정보 초기화)
          </button>
        </div>
      </div>

    <div class="schedule-container">
      <div class="left-panel">
        <div class="card header">
          <div class="header-top">
            <h1>공지 · 장학 스케줄러</h1>
            <button type="button" onclick="location.href='frontend.html'" class="btn-primary back-to-search-btn">
              🔍 공지 검색하러 가기
            </button>
            <button type="button" onclick="location.href='my_notice_archive.html'" class="btn-primary back-to-search-btn">
              🗂️ 공지 보관함으로 가기
            </button>
          </div>
        </div>

        <div class="card">
          <div class="section-title">선택한 날짜</div>
          <div class="selected-date"></div>
          <div class="badge">날짜를 눌러 공지/장학/기타 스케줄을 추가할 수 있어요</div>

          <form id="eventForm">
            <div class="form-group">
              <label class="form-label" for="mainCategory">종류</label>
              <select id="mainCategory" required></select>
            </div>

            <div class="form-group">
              <label class="form-label" for="subCategory">세부항목</label>
              <select id="subCategory" required></select>
            </div>

            <div class="form-group">
              <label class="form-label" for="eventTitle">제목</label>
              <input type="text" id="eventTitle" placeholder="예: 국가장학금 2차 신청" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="startDate">시작 날짜 (선택)</label>
              <input type="date" id="startDate" />
            </div>

            <div class="form-group">
              <label class="form-label" for="endDate">종료 날짜 (선택)</label>
              <input type="date" id="endDate" />
            </div>

            <div class="form-group">
              <label class="form-label" for="eventMemo">메모 (선택)</label>
              <textarea id="eventMemo" placeholder="관련 링크, 금액, 해야 할 일을 적어두세요."></textarea>
            </div>

            <div class="button-row">
              <div class="badge">시작 날짜와 종료 날짜를 선택하면 해당 범위 전체에 스케줄을 추가할 수 있어요</div>
              <button type="submit" class="btn-primary">선택한 날짜 범위에 스케줄 추가</button>
              <button type="button" class="btn-secondary" id="deleteAllBtn">선택한 날짜 범위 전체 삭제</button>
            </div>

            <div class="status-text" id="statusText"></div>
          </form>

          <div class="event-list" id="eventList"></div>
        </div>
      </div>  

      <div class="right-panel">
        <div class="card calendar-card">
          <div class="calendar-header">
            <button type="button" class="btn-secondary" id="prevMonthBtn">◀</button>
            <div class="calendar-title" id="calendarTitle"></div>
            <button type="button" class="btn-secondary" id="nextMonthBtn">▶</button>
          </div>

          <div class="calendar-weekdays">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
          </div>

          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
      </div>
    </div>  
  
  <script>
  // =========================
  // 1. 상태(State)
  // =========================
  const API_BASE = "http://127.0.0.1:8000";
  const STORAGE_KEY  = 'noticeArchiveItems';   // 보관함
  const SESSION_KEY  = 'userSession';         // 로그인 정보
  const SCHEDULE_KEY = 'scheduleEvents';      // 로컬 스케줄 캐시(사용 중이면)

  let selectedDate;
  let currentMonth = new Date();
  const events = {};

  let rangeStart = null;
  let rangeEnd = null;
  let initialUrlFromQuery = null;

  // =========================
  // 2. 상수(Constants)
  // =========================
  const categoryMap = {
    "장학": ["장학", "국가장학", "성적우수", "근로장학", "장학금", "scholarship", "기타"],
    "학사": ["학사", "수강", "졸업", "성적", "휴학", "복학", "학점", "재수강", "수료", "논문", "강의", "교육과정", "기타"],
    "입학/등록": ["입학", "등록", "전형", "합격", "신입생", "편입", "원서", "기타"],
    "취업/채용": ["채용", "인턴", "취업", "구인", "커리어", "채용설명회", "job", "리크루팅", "현장실습", "기타"],
    "공모전/대회": ["공모전", "대회", "경진", "콘테스트", "해커톤", "공모", "시상", "수상", "기타"],
    "모집/봉사": ["모집", "봉사", "서포터즈", "튜터", "멘토", "지원자", "선발", "학생대표", "위원", "기타"],
    "시설/행정": ["시설", "도서관", "열람실", "wifi", "와이파이", "주차", "셔틀", "기숙사", "식당", "휴관", "공사", "기타"],
    "안전": ["안전", "코로나", "감염", "재난", "비상", "방역", "격리", "기타"],
    "기타": ["기타"]
  };

  // =========================
  // 3. DOM 유틸 / DOM 참조
  // =========================
  const $ = (id) => document.getElementById(id);

  const els = {
    eventForm: $("eventForm"),
    eventList: $("eventList"),
    deleteAllBtn: $("deleteAllBtn"),
    mainCategory: $("mainCategory"),
    subCategory: $("subCategory"),
    eventTitle: $("eventTitle"),
    startDate: $("startDate"),
    endDate: $("endDate"),
    eventMemo: $("eventMemo"),
    selectedDateBox: document.querySelector(".selected-date"),
    calendarGrid: $("calendarGrid"),
    calendarTitle: $("calendarTitle"),
    prevMonthBtn: $("prevMonthBtn"),
    nextMonthBtn: $("nextMonthBtn"),
    statusText: $("statusText"),

    userChipBtn: $("userChipBtn"),
    userChipName: $("userChipName"),
    profileModal: $("profileModal"),
    profileName: $("profileName"),
    profileSchool: $("profileSchool"),
    profileMajor: $("profileMajor"),
    profileYear: $("profileYear"),
    profileTags: $("profileTags"),
    logoutBtn: $("logoutBtn"),
  };

  // =========================
  // 4. 상태 메시지
  // =========================
  function setStatus(message = "", type = "") {
    els.statusText.textContent = message;
    els.statusText.className = "status-text";
    if (type) {
      els.statusText.classList.add(type);
    }
  }

  // =========================
  // 5. 날짜 유틸 함수
  // =========================
  function parseLocalDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  const getIso = (date) => {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  };

  const todayIso = () => getIso(new Date());

  const formatDateKorean = (dateStr) => {
    const [y, m, d] = dateStr.split("-");
    return `${y}년 ${+m}월 ${+d}일`;
  };

  const formatMonthKorean = (date) => {
    return `${date.getFullYear()}년 ${date.getMonth() + 1}월`;
  };

  function normalizeRange(startIso, endIso) {
      if (!startIso || !endIso) return { start: startIso, end: endIso };
      return startIso <= endIso
        ? { start: startIso, end: endIso }
        : { start: endIso, end: startIso };
  }
 
  function getDatesInRange(startIso, endIso) {
      if (!startIso || !endIso) return [];

      const { start, end } = normalizeRange(startIso, endIso);
      const result = [];

      let cursor = parseLocalDate(start);
      const endDate = parseLocalDate(end);

      while (cursor <= endDate) {
        result.push(getIso(cursor));
        cursor.setDate(cursor.getDate() + 1);
      }

      return result;
  }
  
  function isDateInSelectedRange(iso) {
      if (!rangeStart) return false;
      if (!rangeEnd) return iso === rangeStart;

      const { start, end } = normalizeRange(rangeStart, rangeEnd);
      return iso >= start && iso <= end;
  }
  
   function getCurrentTargetDates() {
      if (rangeStart && rangeEnd) {
        return getDatesInRange(rangeStart, rangeEnd);
      }
      if (rangeStart) {
        return [rangeStart];
      }
      return selectedDate ? [selectedDate] : [];
    }

    function syncDateInputsFromRange() {
      if (rangeStart && rangeEnd) {
        const { start, end } = normalizeRange(rangeStart, rangeEnd);
        els.startDate.value = start;
        els.endDate.value = end;
      } else if (rangeStart) {
        els.startDate.value = rangeStart;
        els.endDate.value = "";
      } else {
        els.startDate.value = "";
        els.endDate.value = "";
      }
    }

  function syncRangeFromInputs() {
    const start = els.startDate.value;
    const end = els.endDate.value;

    rangeStart = start || null;
    rangeEnd = end || null;

    if (rangeStart && rangeEnd) {
      const { start: normalizedStart, end: normalizedEnd } = normalizeRange(rangeStart, rangeEnd);
      rangeStart = normalizedStart;
      rangeEnd = normalizedEnd;
      selectedDate = rangeEnd;
      currentMonth = parseLocalDate(rangeEnd);
    } else if (rangeStart) {
      selectedDate = rangeStart;
      currentMonth = parseLocalDate(rangeStart);
    } else if (rangeEnd) {
      selectedDate = rangeEnd;
      currentMonth = parseLocalDate(rangeEnd);
    }

    updateSelectedDateUI();
    renderCalendar();
  }

  // =========================
  // 6. 서버 연동
  // =========================
  async function fetchJson(url, options = {}) {
    const response = await fetch(url, options);
    if (!response.ok) {
      throw new Error(`요청 실패: ${response.status}`);
    }
    if(response.status == 204) return null;

    const text = await response.text();
    return text ? JSON.parse(text) : null;
  }

  async function loadSchedulesFromServer() {
      try {
        setStatus("스케줄을 불러오는 중입니다...");
        const data = await fetchJson(`${API_BASE}/schedules`);

        Object.keys(events).forEach((key) => delete events[key]);

        data.forEach((item) => {
          const rawDate = item.date;
          if (!rawDate) return;

          const dateKey = String(rawDate).slice(0, 10);

          if (!events[dateKey]) events[dateKey] = [];
          events[dateKey].push({
            id: item.id,
            mainCategory: item.main_category,
            subCategory: item.sub_category,
            title: item.title,
            startDate: item.start_date,
            endDate: item.end_date,
            memo: item.memo,
            url: item.url
          });
        });

        updateSelectedDateUI();
        renderCalendar();
        setStatus("스케줄을 불러왔습니다.", "success");
      } catch (error) {
        console.error(error);
        setStatus("서버에서 스케줄을 불러오지 못했습니다. 백엔드 실행 여부를 확인하세요.", "error");
      }
    }

    async function createScheduleOnServer(payload) {
      return await fetchJson(`${API_BASE}/schedules`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
    }

  async function deleteScheduleOnServer(id) {
      return await fetchJson(`${API_BASE}/schedules/${id}`, {
        method: "DELETE",
      });
  }

  async function deleteRangeUsingSingleDelete(startIso, endIso) {
    const { start, end } = normalizeRange(startIso, endIso);
    const dates = getDatesInRange(start, end);

    const targets = [];
    dates.forEach((iso) => {
      (events[iso] || []).forEach((ev) => targets.push({ iso, ev }));
    });

    if (!targets.length) {
      setStatus("선택한 범위에 삭제할 스케줄이 없습니다.");
      return;
    }

    for (const { iso, ev } of targets) {
      try {
        await deleteScheduleOnServer(ev.id);
        const list = events[iso];
        const idx = list.findIndex((x) => x.id === ev.id);
        if (idx !== -1) {
          list.splice(idx, 1);
          if (!list.length) {
            delete events[iso];
          }
        }
      } catch (error) {
        console.error("범위 삭제 중 에러:", error);
      }
    }

    renderEventList();
    renderCalendar();
  }

  function isDuplicateEventOnDate(dateIso, title) {
  const list = events[dateIso] || [];
  return list.some(ev => ev.title === title);
}
  // =========================
  // 7. 카테고리 렌더링
  // =========================
  function renderMainCategories() {
    els.mainCategory.innerHTML = "";

    Object.keys(categoryMap).forEach((category) => {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      els.mainCategory.appendChild(option);
    });
  }

  function renderSubCategories(mainCategory) {
    const subCategories = categoryMap[mainCategory] || [];
    els.subCategory.innerHTML = "";

    subCategories.forEach((sub) => {
      const option = document.createElement("option");
      option.value = sub;
      option.textContent = sub;
      els.subCategory.appendChild(option);
    });
  }
  
  function applyQueryToForm() {
  const params = new URLSearchParams(window.location.search);
  const title = params.get('title');
  const category = params.get('category');
  const subCategory = params.get('subCategory');
  const url = params.get('url');
  const memo = params.get('memo');

    if (title) {
      els.eventTitle.value = title;
    }

    if (memo || url) {
      const memoParts = [];
      if (memo) memoParts.push(memo);
      if (url) memoParts.push(`원문 링크: ${url}`);
      els.eventMemo.value = memoParts.join('\n');
    }

    if (url) {
      initialUrlFromQuery = url;
    }

    if (category && categoryMap[category]) {
      els.mainCategory.value = category;
      renderSubCategories(category);
    } else {
      renderSubCategories(els.mainCategory.value);
    } 

    if (subCategory) {
      Array.from(els.subCategory.options).forEach((opt) => {
        if (opt.value === subCategory) {
          els.subCategory.value = subCategory;
        }
      });
    }
  }

  // =========================
  // 8. 일정 목록 렌더링
  // =========================
  function renderEventList() {
    const list = events[selectedDate] || [];
    els.eventList.innerHTML = "";

    if (!list.length) {
      els.eventList.innerHTML = '<div class="empty-text">이 날짜에는 저장된 스케줄이 없습니다.</div>';
      return;
    }

    list.forEach((ev, index) => {
      const item = document.createElement("div");
      item.className = "event-item";

      const pillClass =
        ev.mainCategory === "장학"
          ? "scholarship"
          : ev.mainCategory === "시설/행정"
          ? "etc"
          : "";

      item.innerHTML = `
        <div class="event-main">
          <div class="event-type-pill ${pillClass}">
            ${ev.mainCategory}
          </div>
          <div class="event-title">${ev.title}</div>

          <div class="event-time">
            ${ev.subCategory ? `세부항목: ${ev.subCategory}` : ""}
            ${ev.startDate ? ` · 시작: ${ev.startDate}` : ""}
            ${ev.endDate ? ` · 종료: ${ev.endDate}` : ""}
          </div>
          ${ev.memo ? `<div class="event-memo">${ev.memo}</div>` : ""}
          ${ev.url ? `<a class="event-link" href="${ev.url}" target="_blank" rel="noopener noreferrer"> 원문 바로가기 </a>` : ""}
        </div>
      `;

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "btn-secondary";
      deleteBtn.type = "button";
      deleteBtn.textContent = "삭제";

      deleteBtn.addEventListener("click", async () => {
        const ev = list[index];

        if (!confirm("이 스케줄을 삭제할까요?")) return;

        try {
          setStatus("스케줄을 삭제하는 중입니다...");
          await deleteScheduleOnServer(ev.id);

          events[selectedDate].splice(index, 1);
          if (!events[selectedDate].length) {
            delete events[selectedDate];
          }

          renderEventList();
          renderCalendar();
          setStatus("스케줄이 삭제되었습니다.", "success");
        } catch (error) {
          console.error(error);
          setStatus("스케줄 삭제 중 오류가 발생했습니다.", "error");
        }
      });

      item.appendChild(deleteBtn);
      els.eventList.appendChild(item);
    });
  }

  function updateSelectedDateUI() {
    if (!els.selectedDateBox) return;

    if (rangeStart && rangeEnd) {
      const { start, end } = normalizeRange(rangeStart, rangeEnd);
      els.selectedDateBox.textContent =
        `${formatDateKorean(start)} ~ ${formatDateKorean(end)}`;
    } else if (rangeStart) {
      els.selectedDateBox.textContent = `${formatDateKorean(rangeStart)} (시작 날짜 선택됨)`;
    } else if (selectedDate) {
      els.selectedDateBox.textContent = formatDateKorean(selectedDate);
    } else {
      els.selectedDateBox.textContent = "날짜를 선택하세요";
    }

    renderEventList();
  }

  // =========================
  // 9. 달력 렌더링
  // =========================
  function getBadgeClass(mainCategory) {
   switch (mainCategory) {
    case "장학":
      return "cat-scholarship";
    case "학사":
      return "cat-academic";
    case "입학/등록":
      return "cat-admission";
    case "취업/채용":
      return "cat-career";
    case "공모전/대회":
      return "cat-contest";
    case "모집/봉사":
      return "cat-volunteer";
    case "시설/행정":
      return "cat-facility";
    case "안전":
      return "cat-safety";
    case "기타":
      return "cat-etc";
    default:
      return "";
    }  
  }

  function createDayCell(date, muted) {
    const iso = getIso(date);
    const dayEvents = events[iso] || [];

    const cell = document.createElement("div");
    cell.className = "calendar-day";

    if (muted) cell.classList.add("muted");
    if (iso === todayIso()) cell.classList.add("today");
    if (isDateInSelectedRange(iso)) cell.classList.add("in-range");
    if (iso === rangeStart || iso === rangeEnd) cell.classList.add("range-edge");

    cell.innerHTML = `
      <div class="calendar-day-number">${date.getDate()}</div>
      <div class="calendar-day-events"></div>
    `;

    const eventsContainer = cell.querySelector(".calendar-day-events");

    dayEvents.slice(0, 6).forEach((ev) => {
      const badge = document.createElement("div");
      badge.className = `calendar-event-badge ${getBadgeClass(ev.mainCategory)}`;
      badge.textContent = ev.title;
      eventsContainer.appendChild(badge);
    });

    if (dayEvents.length > 6) {
      const more = document.createElement("div");
      more.className = "calendar-event-more";
      more.textContent = `+${dayEvents.length - 6}`;
      eventsContainer.appendChild(more);
    }

    cell.addEventListener("click", () => {
      const clickedIso = iso;

      if (!rangeStart || (rangeStart && rangeEnd)) {
        rangeStart = clickedIso;
        rangeEnd = null;
      } else {
        const normalized = normalizeRange(rangeStart, clickedIso);
        rangeStart = normalized.start;
        rangeEnd = normalized.end;
      }

      selectedDate = clickedIso;
      currentMonth = new Date(date.getFullYear(), date.getMonth(), 1);
        
      syncDateInputsFromRange();
      updateSelectedDateUI();
      renderCalendar();
    });

    els.calendarGrid.appendChild(cell);
  }

  function renderCalendar() {
    const year = currentMonth.getFullYear();
    const month = currentMonth.getMonth();

    els.calendarTitle.textContent = formatMonthKorean(currentMonth);
    els.calendarGrid.innerHTML = "";

    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    for (let i = 0; i < startWeekday; i++) {
      const dayNum = prevMonthDays - startWeekday + i + 1;
      const date = new Date(year, month - 1, dayNum);
      createDayCell(date, true);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(year, month, day);
      createDayCell(date, false);
    }

    const totalCells = els.calendarGrid.children.length;
    const remain = 42 - totalCells;

    for (let i = 1; i <= remain; i++) {
      const date = new Date(year, month + 1, i);
      createDayCell(date, true);
    }
  }

  // =========================
  // 10. 이벤트 핸들러
  // =========================
  function handleMainCategoryChange() {
    renderSubCategories(els.mainCategory.value);
  }

  async function handleEventSubmit(e) {
  e.preventDefault();

  const mainCategory = els.mainCategory.value;
  const subCategory = els.subCategory.value;
  const title = els.eventTitle.value.trim();
  const memo = els.eventMemo.value.trim();
  const url = initialUrlFromQuery || null;

  if (!title) return;

  const targetDates = getCurrentTargetDates();

  if (!targetDates.length) {
    alert("먼저 시작 날짜 또는 종료 날짜를 선택해 주세요.");
    return;
  }

  // 1) 날짜별로 이미 같은 제목이 있는지 확인해서, 없는 날짜만 골라냄
  const uniqueDates = targetDates.filter(dateIso => {
    const isDup = isDuplicateEventOnDate(dateIso, title);
    return !isDup;
  });

  if (!uniqueDates.length) {
    alert("선택한 날짜 범위에는 이미 같은 제목의 스케줄이 모두 등록되어 있습니다.");
    return;
  }

  try {
    setStatus("스케줄을 저장하는 중입니다...");

    // 2) 중복 아닌 날짜에 대해서만 서버에 저장
    for (const dateIso of uniqueDates) {
      await createScheduleOnServer({
        date: dateIso,
        main_category: mainCategory,
        sub_category: subCategory,
        title: title,
        start_date: rangeStart,
        end_date: rangeEnd,
        memo: memo,
        url: url
      });
    }

    els.eventTitle.value = "";
    els.eventMemo.value = "";
    initialUrlFromQuery = null;

    await loadSchedulesFromServer();
    setStatus("스케줄이 저장되었습니다.", "success");
  } catch (error) {
    console.error(error);
    setStatus("스케줄 저장 중 오류가 발생했습니다.", "error");
  }
}

  async function handleDeleteAll() {
    const targetDates = getCurrentTargetDates();
    const hasAnyEvent = targetDates.some((dateIso) => events[dateIso]?.length);
    
    if (!targetDates.length) {
      alert("먼저 삭제할 날짜(또는 날짜 범위)를 선택해 주세요.");
      return;
    }

    if (!hasAnyEvent) {
      alert("선택한 범위에 저장된 스케줄이 없습니다.");
      return;
    }

    if (!confirm("선택된 날짜의 스케줄을 모두 삭제할까요?")) return;

    const start = targetDates[0];
    const end = targetDates[targetDates.length - 1];

    try {
      setStatus("스케줄을 삭제하는 중입니다...");
      await deleteRangeUsingSingleDelete(start, end);
      setStatus("선택 범위의 스케줄이 삭제되었습니다.", "success");
    } catch (error) {
      console.error(error);
      setStatus("스케줄 삭제 중 오류가 발생했습니다.", "error");
    }
  }

  function handleNextMonth() {
    currentMonth = new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth() + 1,
      1
    );
    renderCalendar();
  }

  function handlePrevMonth() {
    currentMonth = new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth() - 1,
      1
    );
    renderCalendar();
  }

  // =========================
  // 11. 사용자 세션 / 로그아웃
  // =========================
  function loadUserSession() {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch {
      return null;
    }
  }

  function fillUserChip(user) {
    if (!user) {
      els.userChipName.textContent = "게스트 님";
      return;
    }
    els.userChipName.textContent = `${user.name || "사용자"} 님`;
  }

  function fillProfileCard(user) {
    if (!user) return;
    els.profileName.textContent = user.name || "사용자";
    els.profileSchool.textContent = user.school || "학교 정보 없음";
    els.profileMajor.textContent = user.major || "학과 정보 없음";

    const yearMap = {
      "1": "1학년",
      "2": "2학년",
      "3": "3학년",
      "4": "4학년 이상",
    };
    els.profileYear.textContent = user.year ? yearMap[user.year] || "" : "";

    const interests = Array.isArray(user.interests) ? user.interests : [];
    els.profileTags.innerHTML = "";
    if (!interests.length) {
      const span = document.createElement("span");
      span.className = "profile-text";
      span.textContent = "관심 분야 없음";
      els.profileTags.appendChild(span);
    } else {
      interests.forEach(label => {
        const tag = document.createElement("span");
        tag.className = "profile-tag-pill";
        tag.textContent = label;
        els.profileTags.appendChild(tag);
      });
    }
  }

  function openProfileModal() {
    const user = loadUserSession();
    fillProfileCard(user);
    els.profileModal.style.display = "block";
  }

  function closeProfileModal() {
    els.profileModal.style.display = "none";
  }

  // 서버 단일 삭제 엔드포인트로 모든 스케줄 삭제
  async function deleteAllSchedulesOnServer() {
    try {
      const listRes = await fetch(`${API_BASE}/schedules?skip=0&limit=1000`);
      if (!listRes.ok) {
        console.error("스케줄 목록 조회 실패:", listRes.status);
        return;
      }
      const schedules = await listRes.json();
      const ids = schedules.map((s) => s.id);

      await Promise.all(
        ids.map((id) =>
          fetch(`${API_BASE}/schedules/${id}`, {
            method: "DELETE",
          }).catch((e) => console.error("스케줄 삭제 실패:", id, e))
        )
      );
    } catch (e) {
      console.error("서버 스케줄 전체 삭제 중 오류:", e);
    }
  }

  async function handleLogout() {
    if (!confirm("로그아웃하고 저장된 정보(공지 보관함 & 스케줄러)를 모두 삭제할까요?")) return;

    // 1) 서버 스케줄 전체 삭제
    await deleteAllSchedulesOnServer();

    // 2) 로컬 저장소 정리
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(SCHEDULE_KEY);

    alert("로그아웃이 완료되었습니다. 공지 보관함과 스케줄러 내용이 모두 초기화되었습니다.");

    closeProfileModal();
    window.location.href = "login.html";  // 로그인 페이지 파일명에 맞게 수정
  }

  // =========================
  // 12. 이벤트 바인딩
  // =========================
  els.mainCategory.addEventListener("change", handleMainCategoryChange);
  els.eventForm.addEventListener("submit", handleEventSubmit);
  els.deleteAllBtn.addEventListener("click", handleDeleteAll);
  els.prevMonthBtn.addEventListener("click", handlePrevMonth);
  els.nextMonthBtn.addEventListener("click", handleNextMonth);
  els.startDate.addEventListener("change", syncRangeFromInputs);
  els.endDate.addEventListener("change", syncRangeFromInputs);

  els.userChipBtn.addEventListener("click", () => {
    const isOpen = els.profileModal.style.display === "block";
    if (isOpen) closeProfileModal();
    else openProfileModal();
  });

  els.logoutBtn.addEventListener("click", handleLogout);
  
document.addEventListener("click", (event) => {
    const target = event.target;

    // 이미 닫혀 있으면 신경 안 씀
    if (els.profileModal.style.display !== "block") return;

    // 사용자 칩이나 팝오버 안을 클릭한 경우는 유지
    if (
      target === els.userChipBtn ||
      els.userChipBtn.contains(target) ||
      els.profileModal.contains(target)
    ) {
      return;
    }

    // 그 외 어디든 클릭하면 닫기
    closeProfileModal();
  });
  // =========================
  // 13. 초기화
  // =========================
  async function init() {
    const user = loadUserSession();
    fillUserChip(user);

    selectedDate = todayIso();
    currentMonth = new Date();
    rangeStart = null;
    rangeEnd = null;

    renderMainCategories();
    renderSubCategories(els.mainCategory.value);
    applyQueryToForm();
    updateSelectedDateUI();
    renderCalendar();
    await loadSchedulesFromServer();
  }

  init();
  </script>
